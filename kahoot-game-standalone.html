<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kahoot! — Child Effect on Parents</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: #46178F; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
@keyframes popIn { from { transform:scale(0.7); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes slideUp { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
.screen { display: none; width: 100%; max-width: 900px; padding: 24px 20px; }
.screen.active { display: flex; flex-direction: column; align-items: center; gap: 20px; animation: slideUp 0.35s ease; }
button { cursor: pointer; font-family: 'Montserrat', sans-serif; border: none; transition: transform 0.1s, filter 0.1s; }
button:hover { filter: brightness(1.08); transform: translateY(-2px); }
button:active { transform: translateY(1px); }
a { color: #fff; text-decoration: none; }
.ans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.ans-btn { border-radius: 12px; padding: 18px 20px; display: flex; align-items: center; gap: 12px; color: #fff; font-size: clamp(14px, 2.5vw, 20px); font-weight: 700; text-align: left; width: 100%; word-break: break-word; }
.ans-icon { background: rgba(0,0,0,0.2); width: 40px; height: 40px; min-width: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
@media (max-width: 500px) { .ans-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- LOBBY -->
<div class="screen active" id="lobby">
  <div style="background:#fff;border-radius:16px;padding:14px 48px;">
    <span style="font-size:60px;font-weight:900;color:#46178F;letter-spacing:-1px;">kahoot!</span>
  </div>
  <div style="background:rgba(255,255,255,0.12);border-radius:16px;padding:40px 64px;text-align:center;max-width:820px;width:100%;">
    <div style="font-size:18px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:16px;">Child Effect on Parents</div>
    <div style="font-size:32px;color:#fff;font-weight:700;line-height:1.3;">4 Questions · 20 Seconds Each</div>
  </div>
  <button onclick="startGame()" style="background:#fff;color:#46178F;border-radius:12px;padding:22px 80px;font-size:28px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,0.3);">Start Game</button>
  <span style="color:rgba(255,255,255,0.5);font-size:15px;">Single-player mode</span>
</div>

<!-- COUNTDOWN -->
<div class="screen" id="countdown">
  <div style="font-size:22px;color:rgba(255,255,255,0.7);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;">Get Ready!</div>
  <div id="countNum" style="font-size:200px;color:#fff;font-weight:900;line-height:1;animation:pulse 0.5s ease infinite;">3</div>
</div>

<!-- QUESTION -->
<div class="screen" id="questionScreen" style="gap:20px;">
  <div style="background:rgba(0,0,0,0.25);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0;width:100%;">
    <span id="qLabel" style="color:rgba(255,255,255,0.6);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">Question 1 of 4</span>
    <span id="timerDisplay" style="font-size:18px;font-weight:800;color:#fff;">20s</span>
    <span id="scoreDisplay" style="color:rgba(255,255,255,0.6);font-size:15px;font-weight:700;">Score: 0</span>
  </div>
  <div style="background:rgba(0,0,0,0.15);border-radius:0 0 12px 12px;width:100%;overflow:hidden;">
    <div style="background:rgba(0,0,0,0.25);height:8px;position:relative;">
      <div id="timerBar" style="position:absolute;left:0;top:0;height:100%;background:#26890C;width:100%;border-radius:4px;transition:width 1s linear;"></div>
    </div>
    <div style="padding:36px 40px;text-align:center;">
      <div id="questionText" style="font-size:28px;color:#fff;font-weight:700;line-height:1.35;"></div>
    </div>
  </div>
  <div class="ans-grid">
    <button id="btnA" onclick="choose(0)" class="ans-btn" style="background:#E21B3C;">
      <span class="ans-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="12,2 22,20 2,20"/></svg></span>
      <span id="ansA"></span>
    </button>
    <button id="btnB" onclick="choose(1)" class="ans-btn" style="background:#1368CE;">
      <span class="ans-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="2" y="2" width="20" height="20"/></svg></span>
      <span id="ansB"></span>
    </button>
    <button id="btnC" onclick="choose(2)" class="ans-btn" style="background:#FFA602;">
      <span class="ans-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="10"/></svg></span>
      <span id="ansC"></span>
    </button>
    <button id="btnD" onclick="choose(3)" class="ans-btn" style="background:#26890C;">
      <span class="ans-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="12,2 22,12 12,22 2,12"/></svg></span>
      <span id="ansD"></span>
    </button>
  </div>
</div>

<!-- REVEAL -->
<div class="screen" id="reveal" style="text-align:center;gap:28px;max-width:860px;">
  <div id="revealEmoji" style="font-size:72px;"></div>
  <div id="revealMsg" style="font-size:40px;color:#fff;font-weight:800;"></div>
  <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:24px 48px;">
    <div style="font-size:16px;color:rgba(255,255,255,0.6);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em;">Correct Answer</div>
    <div id="correctAnswerText" style="font-size:26px;color:#fff;font-weight:700;"></div>
  </div>
  <div id="pointsMsg" style="font-size:22px;color:rgba(255,255,255,0.7);font-weight:600;"></div>
  <button id="nextBtn" onclick="nextStep()" style="background:#fff;color:#46178F;border-radius:12px;padding:18px 64px;font-size:22px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,0.3);">Next Question →</button>
</div>

<!-- FINAL -->
<div class="screen" id="final" style="text-align:center;gap:32px;max-width:700px;">
  <div style="background:#fff;border-radius:16px;padding:12px 40px;">
    <span style="font-size:48px;font-weight:900;color:#46178F;">kahoot!</span>
  </div>
  <div style="font-size:38px;color:#fff;font-weight:800;">Game Over!</div>
  <div style="background:rgba(255,255,255,0.12);border-radius:16px;padding:40px 60px;width:100%;">
    <div style="font-size:18px;color:rgba(255,255,255,0.6);font-weight:600;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.08em;">Final Score</div>
    <div id="finalScore" style="font-size:96px;color:#fff;font-weight:900;line-height:1;"></div>
    <div id="maxScoreLabel" style="font-size:20px;color:rgba(255,255,255,0.6);margin-top:8px;">out of 4000 points</div>
  </div>
  <div id="finalMsg" style="font-size:26px;color:#fff;font-weight:700;"></div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
    <button onclick="restartGame()" style="background:#fff;color:#46178F;border-radius:12px;padding:16px 48px;font-size:20px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,0.3);">Play Again</button>
    <a href="child-effect-on-parents-bundle.html" style="background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.4);border-radius:12px;padding:16px 48px;font-size:20px;font-weight:800;display:inline-flex;align-items:center;">Back to Deck</a>
  </div>
</div>

<script>
const QUESTIONS = [
  { q: 'What term describes the developmental process of becoming a mother — coined by anthropologist Dana Raphael?', answers: ['Adolescence', 'Matrescence', 'Metamorphosis', 'Parentification'], correct: 1 },
  { q: 'Approximately what percentage of couples report a significant decline in marital quality in the first 3 years post-birth?', answers: ['33%', '50%', '67%', '85%'], correct: 2 },
  { q: 'Compared to non-parents, parents consistently report which of the following?', answers: ['Higher daily happiness', 'More free time', 'Stronger sense of purpose & meaning', 'Better physical health'], correct: 2 },
  { q: 'What percentage of mothers experience postpartum depression in the first year?', answers: ['2–3%', '5–7%', '10–15%', '20–25%'], correct: 2 }
];

let currentQ = 0, score = 0, timer = 20, timerInterval = null, answered = false;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  currentQ = 0; score = 0;
  show('countdown');
  let n = 3;
  document.getElementById('countNum').textContent = n;
  const cd = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(cd); loadQuestion(); }
    else document.getElementById('countNum').textContent = n;
  }, 900);
}

function loadQuestion() {
  answered = false; timer = 20;
  const q = QUESTIONS[currentQ];
  document.getElementById('qLabel').textContent = `Question ${currentQ + 1} of ${QUESTIONS.length}`;
  document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('ansA').textContent = q.answers[0];
  document.getElementById('ansB').textContent = q.answers[1];
  document.getElementById('ansC').textContent = q.answers[2];
  document.getElementById('ansD').textContent = q.answers[3];
  ['btnA','btnB','btnC','btnD'].forEach(id => { document.getElementById(id).style.opacity = '1'; document.getElementById(id).disabled = false; });
  updateTimer();
  show('questionScreen');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timer--;
    updateTimer();
    if (timer <= 0) { clearInterval(timerInterval); revealAnswer(null); }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timerDisplay');
  const bar = document.getElementById('timerBar');
  el.textContent = timer + 's';
  el.style.color = timer > 10 ? '#fff' : timer > 5 ? '#FFA602' : '#E21B3C';
  bar.style.width = (timer / 20 * 100) + '%';
  bar.style.background = timer > 10 ? '#26890C' : timer > 5 ? '#FFA602' : '#E21B3C';
}

function choose(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  revealAnswer(idx);
}

function revealAnswer(idx) {
  const q = QUESTIONS[currentQ];
  const correct = q.correct;
  const wasCorrect = idx === correct;
  const points = wasCorrect ? Math.round(500 + (timer / 20) * 500) : 0;
  if (wasCorrect) score += points;
  ['btnA','btnB','btnC','btnD'].forEach((id, i) => {
    const btn = document.getElementById(id);
    btn.disabled = true;
    if (i === correct) btn.style.opacity = '1';
    else btn.style.opacity = i === idx ? '0.5' : '0.3';
  });
  document.getElementById('revealEmoji').textContent = idx === null ? '⏰' : wasCorrect ? '✅' : '❌';
  document.getElementById('revealMsg').textContent = idx === null ? "Time's up!" : wasCorrect ? 'Correct!' : 'Not quite!';
  document.getElementById('correctAnswerText').textContent = q.answers[correct];
  document.getElementById('pointsMsg').textContent = wasCorrect ? `+${points} points` : 'No points this round';
  document.getElementById('nextBtn').textContent = currentQ + 1 >= QUESTIONS.length ? 'See Final Score' : 'Next Question →';
  show('reveal');
}

function nextStep() {
  currentQ++;
  if (currentQ >= QUESTIONS.length) {
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalMsg').textContent =
      score >= 3500 ? '🏆 Outstanding! You clearly paid attention!' :
      score >= 2000 ? '🎉 Great work! Solid understanding!' :
      score >= 1000 ? '👏 Good effort! Review the slides to improve.' :
      '📚 No worries — the slides cover it all!';
    document.body.style.background = '#1a0044';
    show('final');
  } else {
    show('countdown');
    let n = 3;
    document.getElementById('countNum').textContent = n;
    const cd = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(cd); loadQuestion(); }
      else document.getElementById('countNum').textContent = n;
    }, 900);
  }
}

function restartGame() {
  document.body.style.background = '#46178F';
  show('lobby');
}
</script>
</body>
</html>
